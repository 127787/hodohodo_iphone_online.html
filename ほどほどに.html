<!DOCTYPE html>

<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f5">
<title>ほどほどに</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    text-align: center;
    color: #111;
    -webkit-tap-highlight-color: transparent;
  }
  .container { width: 100%; max-width: 440px; margin: 0 auto; }
  h1 { margin: 10px 0 28px; font-size: 30px; }
  .label { font-size: 20px; }
  #total { font-size: clamp(54px, 15vw, 68px); font-weight: 700; margin: 14px 0 24px; font-variant-numeric: tabular-nums; }
  button {
    display: block;
    width: 100%;
    min-height: 76px;
    padding: 14px;
    margin: 10px 0;
    border: 0;
    border-radius: 16px;
    background: #fff;
    color: #111;
    font: inherit;
    font-size: 23px;
    box-shadow: 0 2px 7px rgba(0,0,0,.12);
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.985); background: #f0f0f0; }
  .reset { background: #ff3b30; color: #fff; margin-top: 22px; }
  .reset:active { background: #df2d25; }
  .graphArea {
    background: #fff;
    margin-top: 28px;
    padding: 16px 12px;
    border-radius: 16px;
    box-shadow: 0 2px 7px rgba(0,0,0,.09);
    text-align: left;
  }
  .graphArea h2 { text-align: center; font-size: 19px; margin: 2px 0 16px; }
  .barRow { display: flex; align-items: center; gap: 8px; margin: 11px 0; min-height: 22px; }
  .date { flex: 0 0 48px; font-size: 12px; color: #555; }
  .barTrack { flex: 1; min-width: 0; height: 22px; background: #f1f1f1; border-radius: 6px; overflow: hidden; }
  .bar { height: 100%; min-width: 0; border-radius: 6px; }
  .value { flex: 0 0 48px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { color: #777; font-size: 12px; line-height: 1.5; margin: 14px 4px 0; }
</style>
</head>
<body>
<main class="container">
  <h1>ほどほどに</h1>
  <div class="label">本日のアルコール量</div>
  <div id="total" aria-live="polite" style="color: rgb(17, 17, 17);">0ml</div>

  <button type="button" onclick="addDrink(5)">🍺 ビール</button>
  <button type="button" onclick="addDrink(9)">🥃 ウイスキー</button>
  <button type="button" onclick="addDrink(8)">⚱️ 焼酎</button>
  <button type="button" onclick="addDrink(9)">🍶 日本酒</button>
  <button type="button" onclick="addDrink(7)">🍷 ワイン</button>

  <section class="graphArea" aria-label="過去7日間の記録">
    <h2>過去7日間</h2>
    <div id="graph"><div class="barRow"><div class="date">11/15</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div><div class="barRow"><div class="date">11/16</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div><div class="barRow"><div class="date">11/17</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div><div class="barRow"><div class="date">11/18</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div><div class="barRow"><div class="date">11/19</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div><div class="barRow"><div class="date">11/20</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div><div class="barRow"><div class="date">11/21</div><div class="barTrack"><div class="bar" style="width: 0%; background: rgb(0, 122, 255);"></div></div><div class="value">0ml</div></div></div>
  </section>

  <button type="button" class="reset" onclick="resetToday()">リセット</button>
  <p class="note">記録はこのブラウザ内に保存されます。ブラウザのデータを消去したり、別のブラウザ・別の端末で開いた場合は共有されません。</p>
</main>

<script>
"use strict";
const STORAGE_KEY = "alcoholHistory";

function localDateKey(date = new Date()) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    console.error("記録を読み込めませんでした:", error);
    return {};
  }
}

function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (error) {
    alert("データを保存できませんでした。ブラウザの保存容量や設定をご確認ください。");
    console.error(error);
  }
}

function addDrink(value) {
  const data = loadData();
  const today = localDateKey();
  data[today] = (Number(data[today]) || 0) + value;
  saveData(data);
  updateScreen();
}

function resetToday() {
  if (confirm("本日のデータをリセットしますか？")) {
    const data = loadData();
    data[localDateKey()] = 0;
    saveData(data);
    updateScreen();
  }
}

function updateScreen() {
  const data = loadData();
  const total = Number(data[localDateKey()]) || 0;
  const totalElement = document.getElementById("total");
  totalElement.textContent = `${total}ml`;
  totalElement.style.color = total >= 51 ? "#ff3b30" : "#111";
  drawGraph(data);
}

function drawGraph(data = loadData()) {
  const graph = document.getElementById("graph");
  graph.replaceChildren();

  const days = [];
  for (let i = 6; i >= 0; i--) {
    const date = new Date();
    date.setHours(12, 0, 0, 0);
    date.setDate(date.getDate() - i);
    const key = localDateKey(date);
    days.push({ key, value: Math.max(0, Number(data[key]) || 0) });
  }

  const maxValue = Math.max(51, ...days.map(day => day.value));
  for (const day of days) {
    const row = document.createElement("div");
    row.className = "barRow";

    const dateLabel = document.createElement("div");
    dateLabel.className = "date";
    dateLabel.textContent = day.key.slice(5).replace("-", "/");

    const track = document.createElement("div");
    track.className = "barTrack";

    const bar = document.createElement("div");
    bar.className = "bar";
    bar.style.width = `${(day.value / maxValue) * 100}%`;
    bar.style.background = day.value >= 51 ? "#ff3b30" : "#007aff";
    track.appendChild(bar);

    const value = document.createElement("div");
    value.className = "value";
    value.textContent = `${day.value}ml`;

    row.append(dateLabel, track, value);
    graph.appendChild(row);
  }
}

updateScreen();
</script>


</body></html>
